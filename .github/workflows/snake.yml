name: Actividad animada

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generar snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#5FB3C4&color_dots=#161b22,#1a3550,#24557a,#3c7fa6,#5FB3C4
            dist/snake-light.svg?palette=github-light&color_snake=#2F7F94&color_dots=#ebedf0,#c6e3ec,#8cc7d6,#4fa3b8,#2f7f94

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
